<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisata Domestik — Bee Happy Holiday</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/BHH.svg" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div id="page">
  <div id="nav-placeholder"></div>

  <div class="page-hero section">
    <div class="container">
      <div class="breadcrumb">
        <a href="../index.html">Beranda</a><span>›</span>
        <a href="index.html">Paket Wisata</a><span>›</span>
        <span>Wisata Domestik</span>
      </div>
      <p class="eyebrow mb-2">🇮🇩 Wisata Domestik</p>
      <h1 class="mb-3">Jelajahi <em class="text-gold">Keindahan Nusantara</em></h1>
      <p class="mw-md mx-auto text-base">
        Dari Sabang sampai Merauke — ribuan destinasi indah menanti di tanah air sendiri.
      </p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <!-- Province filter (built dynamically from meta API) -->
      <div class="mb-4">
        <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">Provinsi</p>
        <div class="filter-tabs" id="provinceTabs"></div>
      </div>

      <!-- City filter (shown after province is picked) -->
      <div id="cityFilterWrap" class="mb-8" style="display:none">
        <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">Kota / Destinasi</p>
        <div class="filter-tabs" id="cityTabs"></div>
      </div>

      <div class="pager pager-top" id="pagerTop"></div>
      <div class="grid-auto" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
</div>

<script type="module">
import { API_BASE } from '../js/config.js';
import '../js/main.js';
import { fetchDomestik, fetchMetaDomestik, renderCard, paginate, renderPager, showLoading, showError, reObserve, DEMO } from '../js/listings.js';

const useDemo = API_BASE.includes('YOUR_WORKER');
const PAGE_SIZE = 9;

let allMeta = [];
let allData = [];
let activeProvince = null;
let activeCity = null;
let currentPage = 1;

const grid         = document.getElementById('grid');
const pagerTop     = document.getElementById('pagerTop');
const pager        = document.getElementById('pager');
const provinceTabs = document.getElementById('provinceTabs');
const cityTabs     = document.getElementById('cityTabs');
const cityWrap     = document.getElementById('cityFilterWrap');

function splitLocations(str) {
  if (!str) return [];
  return [...new Set(str.split(',').map(s => s.trim()).filter(Boolean))];
}

function buildProvinceTabs() {
  const provinces = [...new Set(allMeta.flatMap(m => splitLocations(m.province)))].sort();
  provinceTabs.innerHTML =
    `<button class="filter-tab active" data-val="">🇮🇩 Semua</button>` +
    provinces.map(p => `<button class="filter-tab" data-val="${p}">${p}</button>`).join('');

  provinceTabs.addEventListener('click', e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    provinceTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeProvince = tab.dataset.val || null;
    activeCity     = null;
    buildCityTabs();
    load();
  });
}

function buildCityTabs() {
  if (!activeProvince) { cityWrap.style.display = 'none'; return; }
  const cities = [...new Set(allMeta
    .filter(m => splitLocations(m.province).includes(activeProvince))
    .flatMap(m => splitLocations(m.city)))].sort();

  if (!cities.length) { cityWrap.style.display = 'none'; return; }

  cityWrap.style.display = '';
  cityTabs.innerHTML =
    `<button class="filter-tab active" data-val="">Semua Kota</button>` +
    cities.map(c => `<button class="filter-tab" data-val="${c}">${c}</button>`).join('');

  cityTabs.addEventListener('click', e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    cityTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCity = tab.dataset.val || null;
    currentPage = 1;
    load();
  });
}

function renderPage(page) {
  const { pageItems, page: p, totalPages } = paginate(allData, page, PAGE_SIZE);
  currentPage = p;

  grid.innerHTML = pageItems.length
    ? pageItems.map((item, i) => renderCard(item, i * 75)).join('')
    : '<div class="state-box"><div class="state-icon">🇮🇩</div><p class="state-title">Segera Hadir</p><p class="state-desc">Paket untuk destinasi ini sedang kami siapkan.</p></div>';

  const changePage = newPage => {
    renderPage(newPage);
  };
  renderPager(pagerTop, currentPage, totalPages, changePage);
  renderPager(pager, currentPage, totalPages, changePage);

  reObserve();
}

async function load() {
  showLoading(grid);
  pagerTop.innerHTML = '';
  pager.innerHTML = '';
  try {
    const data = useDemo ? DEMO.domestik : await fetchDomestik();
    allData = data.filter(d =>
      (!activeProvince || splitLocations(d.province).includes(activeProvince)) &&
      (!activeCity     || splitLocations(d.city).includes(activeCity)));

    currentPage = 1;
    renderPage(currentPage);
  } catch { showError(grid); }
}

async function init() {
  showLoading(grid);
  try {
    allMeta = useDemo ? DEMO.domestik : await fetchMetaDomestik();
  } catch { allMeta = []; }

  buildProvinceTabs();
  load();
}

init();
</script>
</body>
</html>
