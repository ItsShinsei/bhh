<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisata Mancanegara — Bee Happy Holiday</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/BHH.svg" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div id="page">
  <div id="nav-placeholder"></div>

  <div class="page-hero section">
    <div class="container">
      <div class="breadcrumb">
        <a href="../index.html">Beranda</a><span>›</span>
        <a href="index.html">Paket Wisata</a><span>›</span>
        <span>Wisata Mancanegara</span>
      </div>
      <p class="eyebrow mb-2">✈️ Wisata Mancanegara</p>
      <h1 class="mb-3">Jelajahi <em class="text-gold">Dunia Bersamamu</em></h1>
      <p class="mw-md mx-auto text-base">
        Dari Asia hingga Eropa — wujudkan perjalanan ke luar negeri impianmu bersama Bee Happy Holiday.
      </p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <!-- Country filter -->
      <div class="mb-4">
        <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">Negara</p>
        <div class="filter-tabs" id="countryTabs"></div>
      </div>

      <!-- City filter -->
      <div id="cityFilterWrap" class="mb-8" style="display:none">
        <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">Kota</p>
        <div class="filter-tabs" id="cityTabs"></div>
      </div>

      <div class="grid-auto" id="grid"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
</div>

<script type="module">
import { API_BASE } from '../js/config.js';
import '../js/main.js';
import { fetchInter, fetchMetaInter, renderCard, showLoading, showError, reObserve, DEMO } from '../js/listings.js';

const useDemo = API_BASE.includes('YOUR_WORKER');

let allMeta     = [];
let activeCountry = null;
let activeCity    = null;

const grid       = document.getElementById('grid');
const countryTabs = document.getElementById('countryTabs');
const cityTabs   = document.getElementById('cityTabs');
const cityWrap   = document.getElementById('cityFilterWrap');

function buildCountryTabs() {
  const countries = [...new Set(allMeta.map(m => m.country))].sort();
  countryTabs.innerHTML =
    `<button class="filter-tab active" data-val="">🌍 Semua</button>` +
    countries.map(c => `<button class="filter-tab" data-val="${c}">${c}</button>`).join('');

  countryTabs.addEventListener('click', e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    countryTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCountry = tab.dataset.val || null;
    activeCity    = null;
    buildCityTabs();
    load();
  });
}

function buildCityTabs() {
  if (!activeCountry) { cityWrap.style.display = 'none'; return; }
  const cities = allMeta
    .filter(m => m.country === activeCountry && m.city)
    .map(m => m.city)
    .sort();

  if (!cities.length) { cityWrap.style.display = 'none'; return; }

  cityWrap.style.display = '';
  cityTabs.innerHTML =
    `<button class="filter-tab active" data-val="">Semua Kota</button>` +
    cities.map(c => `<button class="filter-tab" data-val="${c}">${c}</button>`).join('');

  cityTabs.addEventListener('click', e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    cityTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCity = tab.dataset.val || null;
    load();
  });
}

async function load() {
  showLoading(grid);
  try {
    const data = useDemo
      ? DEMO.inter.filter(d =>
          (!activeCountry || d.country === activeCountry) &&
          (!activeCity    || d.city === activeCity))
      : await fetchInter(activeCountry, activeCity);

    grid.innerHTML = data.length
      ? data.map((item, i) => renderCard(item, i * 75)).join('')
      : '<div class="state-box"><div class="state-icon">✈️</div><p class="state-title">Segera Hadir</p><p class="state-desc">Paket untuk destinasi ini sedang kami siapkan.</p></div>';

    reObserve();
  } catch { showError(grid); }
}

async function init() {
  showLoading(grid);
  try {
    allMeta = useDemo
      ? [...new Map(DEMO.inter.map(d => [d.country + d.city, { country: d.country, city: d.city }])).values()]
      : await fetchMetaInter();
  } catch { allMeta = []; }

  buildCountryTabs();
  load();
}

init();
</script>
</body>
</html>
