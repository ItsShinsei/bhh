<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisata Mancanegara — Bee Happy Holiday</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/BHH.svg" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div id="page">
  <div id="nav-placeholder"></div>

  <div class="page-hero section">
    <div class="container">
      <div class="breadcrumb">
        <a href="../index.html">Beranda</a><span>›</span>
        <a href="index.html">Paket Wisata</a><span>›</span>
        <span>Wisata Mancanegara</span>
      </div>
      <p class="eyebrow mb-2">✈️ Wisata Mancanegara</p>
      <h1 class="mb-3">Jelajahi <em class="text-gold">Dunia Bersamamu</em></h1>
      <p class="mw-md mx-auto text-base">
        Dari Asia hingga Eropa — wujudkan perjalanan ke luar negeri impianmu bersama Bee Happy Holiday.
      </p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <!-- Country filter -->
      <div class="mb-4">
        <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">Negara</p>
        <div class="filter-tabs" id="countryTabs"></div>
      </div>

      <!-- City filter -->
      <div id="cityFilterWrap" class="mb-8" style="display:none">
        <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">Kota</p>
        <div class="filter-tabs" id="cityTabs"></div>
      </div>

      <div class="pager pager-top" id="pagerTop"></div>
      <div class="grid-auto" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
</div>

<script type="module">
import { API_BASE } from '../js/config.js';
import '../js/main.js';
import { fetchInter, fetchMetaInter, renderCard, paginate, renderPager, showLoading, showError, reObserve, DEMO, createSearchFilter } from '../js/listings.js';

const useDemo = API_BASE.includes('YOUR_WORKER');
const PAGE_SIZE = 9;

let allMeta = [];
let allData = [];
let activeCountry = null;
let activeCity = null;
let currentPage = 1;

const grid     = document.getElementById('grid');
const pagerTop = document.getElementById('pagerTop');
const pager    = document.getElementById('pager');
const cityWrap = document.getElementById('cityFilterWrap');

function splitLocations(str) {
  if (!str) return [];
  return [...new Set(str.split(',').map(s => s.trim()).filter(Boolean))];
}

const countryFilter = createSearchFilter(document.getElementById('countryTabs'), {
  placeholder: 'Cari negara...',
  onSelect(val) {
    activeCountry = val;
    activeCity = null;
    cityFilter.clear(true);
    buildCityOptions();
    load();
  }
});

const cityFilter = createSearchFilter(document.getElementById('cityTabs'), {
  placeholder: 'Cari kota...',
  onSelect(val) {
    activeCity = val;
    currentPage = 1;
    load();
  }
});

function buildCountryOptions() {
  const countries = [...new Set(allMeta.flatMap(m => splitLocations(m.country)))].sort();
  countryFilter.setOptions(countries);
}

function buildCityOptions() {
  if (!activeCountry) { cityWrap.style.display = 'none'; return; }
  const cities = [...new Set(allMeta
    .filter(m => splitLocations(m.country).includes(activeCountry))
    .flatMap(m => splitLocations(m.city)))].sort();

  if (!cities.length) { cityWrap.style.display = 'none'; return; }
  cityWrap.style.display = '';
  cityFilter.setOptions(cities);
}

function renderPage(page) {
  const { pageItems, page: p, totalPages } = paginate(allData, page, PAGE_SIZE);
  currentPage = p;

  grid.innerHTML = pageItems.length
    ? pageItems.map((item, i) => renderCard(item, i * 75)).join('')
    : '<div class="state-box"><div class="state-icon">✈️</div><p class="state-title">Segera Hadir</p><p class="state-desc">Paket untuk destinasi ini sedang kami siapkan.</p></div>';

  const changePage = newPage => renderPage(newPage);
  renderPager(pagerTop, currentPage, totalPages, changePage);
  renderPager(pager, currentPage, totalPages, changePage);

  reObserve();
}

async function load() {
  showLoading(grid);
  pagerTop.innerHTML = '';
  pager.innerHTML = '';
  try {
    const data = useDemo ? DEMO.inter : await fetchInter();
    allData = data.filter(d =>
      (!activeCountry || splitLocations(d.country).includes(activeCountry)) &&
      (!activeCity    || splitLocations(d.city).includes(activeCity)));

    currentPage = 1;
    renderPage(currentPage);
  } catch { showError(grid); }
}

async function init() {
  showLoading(grid);
  try {
    allMeta = useDemo ? DEMO.inter : await fetchMetaInter();
  } catch { allMeta = []; }

  buildCountryOptions();
  load();
}

init();
</script>
</body>
</html>
