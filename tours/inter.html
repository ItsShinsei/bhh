<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisata Mancanegara — Bee Happy Holiday</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/BHH.svg" />
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <div id="page">
      <div id="nav-placeholder"></div>

      <div class="page-hero section">
        <div class="container">
          <div class="breadcrumb">
            <a href="../index.html">Beranda</a><span>›</span>
            <a href="index.html">Paket Wisata</a><span>›</span>
            <span>Wisata Mancanegara</span>
          </div>
          <p class="eyebrow mb-2">✈️ Wisata Mancanegara</p>
          <h1 class="mb-3">
            Jelajahi <em class="text-gold">Dunia Bersamamu</em>
          </h1>
          <p class="mw-md mx-auto text-base">
            Dari Asia hingga Eropa — wujudkan perjalanan ke luar negeri impianmu
            bersama Bee Happy Holiday.
          </p>
        </div>
      </div>

      <section class="section">
        <div class="container">
          <label class="listing-search">
            <input
              class="listing-search-input"
              id="tourSearch"
              type="search"
              aria-label="Cari paket mancanegara"
              placeholder="Cari paket..."
              autocomplete="off"
            />
          </label>
          <!-- Country filter -->
          <div class="mb-4">
            <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">
              Negara
            </p>
            <div class="filter-tabs" id="countryTabs"></div>
          </div>

          <!-- City filter -->
          <div id="cityFilterWrap" class="mb-8" style="display: none">
            <p class="text-xs fw-600 uppercase ls-lg text-gold-dim mb-2">
              Kota
            </p>
            <div class="filter-tabs" id="cityTabs"></div>
          </div>

          <div class="pager pager-top" id="pagerTop"></div>
          <div class="grid-auto" id="grid"></div>
          <div class="pager" id="pager"></div>
          <div class="section-header reveal mt-8">
            <p class="eyebrow">🎁 Promo</p>
            <h2>Promo Mancanegara</h2>
          </div>
          <div class="grid-auto" id="offersGrid"></div>
        </div>
      </section>

      <div id="footer-placeholder"></div>
    </div>

    <script type="module">
      import { API_BASE } from "../js/config.js";
      import "../js/main.js";
      import {
        fetchInter,
        fetchMetaInter,
        renderCard,
        paginate,
        renderPager,
        showLoading,
        showError,
        reObserve,
        DEMO,
        fetchOffers,
        renderOfferCard,
      } from "../js/listings.js";

      const useDemo = API_BASE.includes("YOUR_WORKER");
      const PAGE_SIZE = 9;

      let allMeta = [];
      let allData = [];
      let activeCountry = null;
      let activeCity = null;
      let currentPage = 1;

      const grid = document.getElementById("grid");
      const pagerTop = document.getElementById("pagerTop");
      const pager = document.getElementById("pager");
      const offersGrid = document.getElementById("offersGrid");
      const cityWrap = document.getElementById("cityFilterWrap");
      const countryTabs = document.getElementById("countryTabs");
      const cityTabs = document.getElementById("cityTabs");
      const tourSearch = document.getElementById("tourSearch");
      let allOffers = [];
      let offersError = false;

      function renderTabs(container, options, activeValue, onSelect) {
        container.replaceChildren();
        const tabs = [
          { value: "", label: "Semua" },
          ...options.map((value) => ({ value, label: value })),
        ];
        tabs.forEach(({ value, label }) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `filter-tab${value === activeValue ? " active" : ""}`;
          button.dataset.val = value;
          button.setAttribute("aria-pressed", String(value === activeValue));
          button.textContent = label;
          button.addEventListener("click", () => {
            container.querySelectorAll(".filter-tab").forEach((tab) => {
              const active = tab === button;
              tab.classList.toggle("active", active);
              tab.setAttribute("aria-pressed", String(active));
            });
            onSelect(value || null);
          });
          container.append(button);
        });
      }

      function splitLocations(str) {
        if (!str) return [];
        return [
          ...new Set(
            str
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean),
          ),
        ];
      }

      function uniqueLocations(locations) {
        const unique = new Map();
        for (const location of locations) {
          const key = location.toLowerCase();
          if (!unique.has(key)) unique.set(key, location);
        }
        return [...unique.values()].sort();
      }

      function hasLocation(value, selected) {
        const normalized = selected.toLowerCase();
        return splitLocations(value).some(
          (location) => location.toLowerCase() === normalized,
        );
      }

      function buildCountryOptions() {
        const countries = uniqueLocations([
          ...allMeta.flatMap((m) => splitLocations(m.country)),
          ...allOffers.flatMap((offer) => splitLocations(offer.country)),
        ]);
        renderTabs(countryTabs, countries, activeCountry || "", (val) => {
          activeCountry = val;
          activeCity = null;
          buildCityOptions();
          load();
        });
      }

      function buildCityOptions() {
        if (!activeCountry) {
          cityWrap.style.display = "none";
          return;
        }
        const cities = [
          ...new Set(
            allMeta
              .filter((m) => hasLocation(m.country, activeCountry))
              .flatMap((m) => splitLocations(m.city))
              .concat(
                allOffers
                  .filter(
                    (offer) =>
                      !splitLocations(offer.country).length ||
                      hasLocation(offer.country, activeCountry),
                  )
                  .flatMap((offer) => splitLocations(offer.city)),
              ),
          ),
        ].sort();

        if (!cities.length) {
          cityWrap.style.display = "none";
          return;
        }
        cityWrap.style.display = "";
        renderTabs(cityTabs, cities, activeCity || "", (val) => {
          activeCity = val;
          currentPage = 1;
          load();
        });
      }

      function renderPage(page) {
        const query = tourSearch.value.trim().toLowerCase();
        const filteredData = allData.filter((item) => {
          return (
            !query ||
            Object.values(item)
              .filter((value) => typeof value === "string")
              .join(" ")
              .toLowerCase()
              .includes(query)
          );
        });
        const {
          pageItems,
          page: p,
          totalPages,
        } = paginate(filteredData, page, PAGE_SIZE);
        currentPage = p;

        grid.innerHTML = pageItems.length
          ? pageItems.map((item, i) => renderCard(item, i * 75)).join("")
          : query
            ? '<div class="state-box"><div class="state-icon">✈️</div><p class="state-title">Tidak Ada Paket</p><p class="state-desc">Coba ubah kata kunci pencarian.</p></div>'
            : '<div class="state-box"><div class="state-icon">✈️</div><p class="state-title">Segera Hadir</p><p class="state-desc">Paket untuk destinasi ini sedang kami siapkan.</p></div>';

        const matchingOffers = allOffers.filter((offer) => {
          const matchesCountry =
            !activeCountry ||
            !splitLocations(offer.country).length ||
            hasLocation(offer.country, activeCountry);
          const matchesCity =
            !activeCity ||
            !splitLocations(offer.city).length ||
            hasLocation(offer.city, activeCity);
          const matchesSearch =
            !query ||
            Object.values(offer)
              .filter((value) => typeof value === "string")
              .join(" ")
              .toLowerCase()
              .includes(query);
          return matchesCountry && matchesCity && matchesSearch;
        });
        if (!offersError) {
          offersGrid.innerHTML = matchingOffers.length
            ? matchingOffers
                .map((offer, i) => renderOfferCard(offer, i * 75))
                .join("")
            : `<div class="state-box"><p class="state-desc">${query ? "Tidak ada promo yang cocok dengan pencarian ini." : "Belum ada promo mancanegara untuk filter lokasi ini."}</p></div>`;
        }

        const changePage = (newPage) => renderPage(newPage);
        renderPager(pagerTop, currentPage, totalPages, changePage);
        renderPager(pager, currentPage, totalPages, changePage);

        reObserve();
      }

      async function load() {
        showLoading(grid);
        pagerTop.innerHTML = "";
        pager.innerHTML = "";
        try {
          const data = useDemo ? DEMO.inter : await fetchInter();
          allData = data.filter(
            (d) =>
              (!activeCountry || hasLocation(d.country, activeCountry)) &&
              (!activeCity || hasLocation(d.city, activeCity)),
          );

          currentPage = 1;
          renderPage(currentPage);
        } catch {
          showError(grid);
        }
      }

      tourSearch.addEventListener("input", () => {
        currentPage = 1;
        renderPage(currentPage);
      });

      async function init() {
        showLoading(grid);
        showLoading(offersGrid);
        try {
          allMeta = useDemo ? DEMO.inter : await fetchMetaInter();
        } catch {
          allMeta = [];
        }

        try {
          allOffers = useDemo ? [] : await fetchOffers("inter");
        } catch {
          offersError = true;
          showError(offersGrid);
        }

        buildCountryOptions();
        load();
      }

      init();
    </script>
  </body>
</html>
