<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri Wisata | Bee Happy Holiday</title>
    <meta name="description" content="Lihat momen perjalanan, destinasi, dan pengalaman pelanggan Bee Happy Holiday dalam galeri kami." />
    <link rel="canonical" href="https://beehappyholiday.my.id/galeri.html" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#3a0f50" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bee Happy Holiday" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Galeri Wisata | Bee Happy Holiday" />
    <meta property="og:description" content="Lihat momen perjalanan, destinasi, dan pengalaman pelanggan Bee Happy Holiday dalam galeri kami." />
    <meta property="og:url" content="https://beehappyholiday.my.id/galeri.html" />
    <meta property="og:image" content="https://beehappyholiday.my.id/assets/images/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="page">
      <div id="nav-placeholder"></div>

      <div class="page-hero section">
        <div class="container">
          <div class="breadcrumb">
            <a href="index.html">Beranda</a><span>›</span><span>Galeri</span>
          </div>
          <p class="eyebrow mb-2">🖼️ Galeri</p>
          <h1 class="mb-3">
            Momen <em class="text-gold">Perjalanan Indah</em>
          </h1>
          <p class="mw-md mx-auto text-base">
            Setiap foto adalah cerita. Lihat momen-momen tak terlupakan para
            wisatawan bersama Bee Happy Holiday.
          </p>
        </div>
      </div>

      <section class="section">
        <div class="container">
          <label class="gallery-search">
            <input
              id="gallerySearch"
              type="search"
              aria-label="Cari foto galeri"
              placeholder="Cari foto..."
              autocomplete="off"
            />
          </label>
          <div
            class="filter-tabs gallery-filter"
            id="galleryTabs"
            aria-label="Filter kategori galeri"
          >
            <button
              class="filter-tab active"
              type="button"
              data-cat="all"
              aria-pressed="true"
            >
              Semua
            </button>
            <button
              class="filter-tab"
              type="button"
              data-cat="inter"
              aria-pressed="false"
            >
              Internasional
            </button>
            <button
              class="filter-tab"
              type="button"
              data-cat="cruise"
              aria-pressed="false"
            >
              Cruise
            </button>
            <button
              class="filter-tab"
              type="button"
              data-cat="domestik"
              aria-pressed="false"
            >
              Domestik
            </button>
            <button
              class="filter-tab"
              type="button"
              data-cat="umroh"
              aria-pressed="false"
            >
              Umroh
            </button>
          </div>
          <div class="masonry" id="galleryGrid"></div>
        </div>
      </section>

      <!-- LIGHTBOX -->
      <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
        <button class="lightbox-close" id="lightboxClose" aria-label="Tutup">
          ✕
        </button>
        <img id="lightboxImg" src="" alt="" />
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script type="module">
      import { API_BASE, driveThumb } from "./js/config.js";
      import "./js/main.js";
      import { fetchGallery } from "./js/listings.js";

      const DEMO_GALLERY = [
        {
          title: "Sunset Kuta, Bali",
          image_url:
            "https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=600&auto=format&fit=crop",
          category: "domestik",
        },
        {
          title: "Sakura Tokyo",
          image_url:
            "https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=800&auto=format&fit=crop",
          category: "inter",
        },
        {
          title: "Marina Bay Sands",
          image_url:
            "https://images.unsplash.com/photo-1555400038-63f5ba517a47?w=600&auto=format&fit=crop",
          category: "inter",
        },
        {
          title: "Gili Trawangan, NTB",
          image_url:
            "https://images.unsplash.com/photo-1552733407-5d5c46c3bb3b?w=700&auto=format&fit=crop",
          category: "domestik",
        },
        {
          title: "Cruise Asia",
          image_url:
            "https://images.unsplash.com/photo-1548194099-bed76927b52e?w=600&auto=format&fit=crop",
          category: "cruise",
        },
        {
          title: "Masjidil Haram",
          image_url:
            "https://images.unsplash.com/photo-1591604466107-ec97de577aff?w=700&auto=format&fit=crop",
          category: "umroh",
        },
        {
          title: "Kawah Ijen",
          image_url:
            "https://images.unsplash.com/photo-1588087640728-2a2d98ed4b88?w=600&auto=format&fit=crop",
          category: "domestik",
        },
        {
          title: "Seoul, Korea Selatan",
          image_url:
            "https://images.unsplash.com/photo-1480796927426-f609979314bd?w=700&auto=format&fit=crop",
          category: "inter",
        },
        {
          title: "Swiss Alps",
          image_url:
            "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&auto=format&fit=crop",
          category: "inter",
        },
        {
          title: "Komodo Island",
          image_url:
            "https://images.unsplash.com/photo-1580508174046-170816f65662?w=700&auto=format&fit=crop",
          category: "domestik",
        },
        {
          title: "Raja Ampat, Papua",
          image_url:
            "https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?w=600&auto=format&fit=crop",
          category: "domestik",
        },
        {
          title: "Paris, Perancis",
          image_url:
            "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=700&auto=format&fit=crop",
          category: "inter",
        },
      ];

      let allGallery = [];
      let currentCat = "all";
      const galleryCategoryLabels = {
        inter: "internasional",
        cruise: "cruise",
        domestik: "domestik",
        umroh: "umroh",
      };
      const gallerySearch = document.getElementById("gallerySearch");
      const galleryTabs = document.getElementById("galleryTabs");

      function render() {
        const grid = document.getElementById("galleryGrid");
        const query = gallerySearch.value.trim().toLowerCase();
        const items = allGallery.filter(
          (g) =>
            (currentCat === "all" || g.category === currentCat) &&
            (!query ||
              `${g.title || ""} ${galleryCategoryLabels[g.category] || g.category || ""}`
                .toLowerCase()
                .includes(query)),
        );

        if (!items.length) {
          grid.style.display = "block";
          grid.innerHTML =
            `<div class="state-box"><div class="state-icon">📷</div><p class="state-desc">${query ? "Tidak ada foto yang cocok." : "Belum ada foto untuk kategori ini."}</p></div>`;
          return;
        }

        grid.style.display = "";
        grid.innerHTML = items
          .map((g) => {
            const url = driveThumb(g.image_url);
            return `
      <div class="masonry-item" data-url="${url}" data-title="${g.title || ""}">
        <img src="${url}" alt="${g.title || ""}" loading="lazy" />
        <div class="masonry-overlay">
          ${g.title ? `<div class="masonry-title">${g.title}</div>` : ""}
        </div>
      </div>`;
          })
          .join("");

        grid.querySelectorAll(".masonry-item").forEach((el) => {
          el.addEventListener("click", () => {
            document.getElementById("lightboxImg").src = el.dataset.url;
            document.getElementById("lightboxImg").alt = el.dataset.title;
            document.getElementById("lightbox").classList.add("open");
            document.body.style.overflow = "hidden";
          });
        });
      }

      gallerySearch.addEventListener("input", render);
      galleryTabs.addEventListener("click", (event) => {
        const tab = event.target.closest(".filter-tab");
        if (!tab) return;

        currentCat = tab.dataset.cat;
        galleryTabs.querySelectorAll(".filter-tab").forEach((button) => {
          const active = button === tab;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        render();
      });
      
      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("open");
        document.body.style.overflow = "";
      }
      document
        .getElementById("lightboxClose")
        .addEventListener("click", closeLightbox);
      document.getElementById("lightbox").addEventListener("click", (e) => {
        if (e.target === document.getElementById("lightbox")) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      async function init() {
        const useDemo = API_BASE.includes("YOUR_WORKER");
        try {
          allGallery = useDemo ? DEMO_GALLERY : await fetchGallery();
        } catch {
          allGallery = DEMO_GALLERY;
        }
        render();
      }

      init();
    </script>
  </body>
</html>
